name: Testes e verificações

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt

      - name: Testar aplicação
        run: python -m pytest -q

      - name: Verificar sintaxe Python
        run: python -m compileall -q main.py local_ai.py storage.py

      - name: Verificar scripts de instalação
        run: bash -n iniciar.sh configurar_ia_local.sh scripts/verificar.sh

      - name: Verificar JavaScript
        run: node --check static/app.js
